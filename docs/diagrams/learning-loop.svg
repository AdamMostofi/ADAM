<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 680" role="img" aria-labelledby="loop-title loop-desc">
  <title id="loop-title">ADAM learning loop</title>
  <desc id="loop-desc">A six-station loop from proof traces through pattern extraction, skill compilation, exercise, scoring, and rule registration into a shared skill registry.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8a877e"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5f6570"/>
    </marker>
  </defs>

  <rect width="1040" height="680" fill="#0b0d10"/>
  <rect x="20" y="20" width="1000" height="640" rx="6" fill="#101318" stroke="#2c333e"/>

  <g font-family="'IBM Plex Mono', 'Courier New', monospace">
    <text x="44" y="52" font-size="9" letter-spacing="2.2" fill="#d4a94a">ADAM / LEARNING</text>
    <text x="996" y="52" font-size="9" text-anchor="end" fill="#8a877e">ONE PASS</text>
  </g>
  <text x="44" y="88" font-family="'Cinzel', 'Times New Roman', serif" font-size="28" fill="#e8e6df">The learning loop</text>
  <text x="44" y="112" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" fill="#8a877e">Each pass writes a reusable rule into the shared registry; the Layer 1 floor stays immutable.</text>
  <line x1="44" y1="132" x2="996" y2="132" stroke="#2c333e"/>

  <g transform="translate(0 14) translate(520 390) scale(0.88) translate(-520 -390)">
  <g fill="none" stroke="#8a877e" stroke-width="1.2">
    <path d="M 605.00 136.28 A 230 230 0 0 1 696.12 202.08" marker-end="url(#arrow)"/>
    <path d="M 734.50 267.00 A 230 230 0 0 1 734.93 431.88" marker-end="url(#arrow)"/>
    <path d="M 696.89 497.00 A 230 230 0 0 1 606.11 563.27" marker-end="url(#arrow)"/>
    <path d="M 435.00 563.72 A 230 230 0 0 1 343.88 497.92" marker-end="url(#arrow)"/>
    <path d="M 305.50 433.00 A 230 230 0 0 1 305.07 268.12" marker-end="url(#arrow)"/>
    <path d="M 343.11 203.00 A 230 230 0 0 1 433.89 136.73" marker-end="url(#arrow)"/>
  </g>

  <g fill="none" stroke="#5f6570" stroke-width="1" stroke-dasharray="5,4">
    <path d="M 520.00 152.00 L 520.00 292.00" marker-end="url(#arrow-soft)"/>
    <path d="M 663.76 267.00 L 615.26 295.00" marker-end="url(#arrow-soft)"/>
    <path d="M 663.76 433.00 L 615.26 405.00" marker-end="url(#arrow-soft)"/>
    <path d="M 520.00 548.00 L 520.00 408.00" marker-end="url(#arrow-soft)"/>
    <path d="M 376.24 433.00 L 424.74 405.00" marker-end="url(#arrow-soft)"/>
    <path d="M 376.24 267.00 L 424.74 295.00" marker-end="url(#arrow-soft)"/>
  </g>

  <g font-family="'Oswald', 'Arial Narrow', sans-serif">
    <rect x="435" y="88" width="170" height="64" rx="4" fill="#101318" stroke="#2c333e"/>
    <text x="449" y="104" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="7" fill="#5f6570">01</text>
    <text x="520" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e6df">EXPERIENCE</text>
    <text x="520" y="140" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="8" fill="#8a877e">proof traces</text>

    <rect x="634.19" y="203" width="170" height="64" rx="4" fill="#101318" stroke="#2c333e"/>
    <text x="648.19" y="219" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="7" fill="#5f6570">02</text>
    <text x="719.19" y="237" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e6df">EXTRACT</text>
    <text x="719.19" y="255" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="8" fill="#8a877e">recurring patterns</text>

    <rect x="634.19" y="433" width="170" height="64" rx="4" fill="#101318" stroke="#2c333e"/>
    <text x="648.19" y="449" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="7" fill="#5f6570">03</text>
    <text x="719.19" y="467" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e6df">COMPILE</text>
    <text x="719.19" y="485" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="8" fill="#8a877e">skill + confidence</text>

    <rect x="435" y="548" width="170" height="64" rx="4" fill="#101318" stroke="#2c333e"/>
    <text x="449" y="564" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="7" fill="#5f6570">04</text>
    <text x="520" y="582" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e6df">EXERCISE</text>
    <text x="520" y="600" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="8" fill="#8a877e">skills in inference</text>

    <rect x="235.81" y="433" width="170" height="64" rx="4" fill="#101318" stroke="#2c333e"/>
    <text x="249.81" y="449" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="7" fill="#5f6570">05</text>
    <text x="320.81" y="467" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e6df">SCORE</text>
    <text x="320.81" y="485" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="8" fill="#8a877e">success / failure</text>

    <rect x="235.81" y="203" width="170" height="64" rx="4" fill="#101318" stroke="#2c333e"/>
    <text x="249.81" y="219" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="7" fill="#5f6570">06</text>
    <text x="320.81" y="237" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e6df">REGISTER</text>
    <text x="320.81" y="255" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="8" fill="#8a877e">rule table updated</text>
  </g>

  <rect x="420" y="298" width="200" height="104" rx="6" fill="#1a1710" stroke="#d4a94a" stroke-width="1.2"/>
  <text x="520" y="330" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="8" letter-spacing="1.6" fill="#d4a94a">SHARED STATE</text>
  <text x="520" y="356" text-anchor="middle" font-family="'Oswald', 'Arial Narrow', sans-serif" font-size="16" font-weight="600" fill="#e8e6df">SKILL REGISTRY</text>
  <text x="520" y="376" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="8" fill="#8a877e">one shared rule table</text>

  </g>

  <line x1="44" y1="628" x2="996" y2="628" stroke="#2c333e"/>
  <text x="44" y="648" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="8" fill="#8a877e">Proof traces feed patterns; patterns become skills; outcomes set fitness; registered rules sharpen the next pass.</text>
  <text x="996" y="648" text-anchor="end" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="8" fill="#5f6570">dashed = write-back to shared state</text>
</svg>
