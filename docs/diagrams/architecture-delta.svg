<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" role="img" aria-labelledby="delta-title delta-desc">
  <title id="delta-title">Web interface architecture delta</title>
  <desc id="delta-desc">Before and after views of the ADAM web interface, with a ledger of the token, shell, chat, renderer, and theme changes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8a877e"/>
    </marker>
  </defs>

  <rect width="1120" height="680" fill="#0b0d10"/>
  <rect x="20" y="20" width="1080" height="640" rx="6" fill="#101318" stroke="#2c333e"/>

  <g font-family="'IBM Plex Mono', 'Courier New', monospace">
    <text x="44" y="52" font-size="9" letter-spacing="2.2" fill="#d4a94a">ADAM / INTERFACE DELTA</text>
    <text x="1076" y="52" font-size="9" text-anchor="end" fill="#8a877e">V0.6 → V0.8</text>
  </g>
  <text x="44" y="88" font-family="'Cinzel', 'Times New Roman', serif" font-size="28" fill="#e8e6df">Same app, rebuilt as a console</text>
  <text x="44" y="112" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" fill="#8a877e">The reasoning core did not move. The interface around it did.</text>
  <line x1="44" y1="132" x2="1076" y2="132" stroke="#2c333e"/>

  <rect x="44" y="164" width="280" height="448" rx="6" fill="#0b0d10" stroke="#2c333e"/>
  <rect x="356" y="164" width="380" height="448" rx="6" fill="#151920" stroke="#2c333e"/>
  <rect x="768" y="164" width="308" height="448" rx="6" fill="#0b0d10" stroke="#2c333e"/>

  <g font-family="'IBM Plex Mono', 'Courier New', monospace">
    <text x="60" y="190" font-size="9" letter-spacing="1.6" fill="#8a877e">BEFORE / V0.6</text>
    <text x="60" y="206" font-size="8" fill="#5f6570">single-page shell</text>
    <text x="372" y="190" font-size="9" letter-spacing="1.6" fill="#d4a94a">CHANGE LEDGER</text>
    <text x="372" y="206" font-size="8" fill="#8a877e">what actually moved</text>
    <text x="784" y="190" font-size="9" letter-spacing="1.6" fill="#e8e6df">AFTER / V0.8</text>
    <text x="784" y="206" font-size="8" fill="#5f6570">console shell</text>
  </g>

  <g font-family="'Oswald', 'Arial Narrow', sans-serif">
    <rect x="60" y="220" width="248" height="52" rx="4" fill="#151920" stroke="#2c333e"/>
    <text x="76" y="242" font-size="12" font-weight="600" fill="#e8e6df">SHELL</text>
    <text x="76" y="259" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="8" fill="#8a877e">single page + tabs</text>
    <rect x="288" y="230" width="14" height="14" rx="2" fill="#1c212a" stroke="#d4a94a"/>
    <text x="295" y="240" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="8" fill="#d4a94a">Δ</text>

    <rect x="60" y="294" width="248" height="52" rx="4" fill="#151920" stroke="#2c333e"/>
    <text x="76" y="316" font-size="12" font-weight="600" fill="#e8e6df">INLINE CHAT</text>
    <text x="76" y="333" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="8" fill="#8a877e">wired inside app.js</text>
    <rect x="288" y="304" width="14" height="14" rx="2" fill="#1c212a" stroke="#d4a94a"/>
    <text x="295" y="314" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="8" fill="#d4a94a">Δ</text>

    <rect x="60" y="368" width="248" height="52" rx="4" fill="#151920" stroke="#2c333e"/>
    <text x="76" y="390" font-size="12" font-weight="600" fill="#e8e6df">MARKDOWN</text>
    <text x="76" y="407" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="8" fill="#8a877e">innerHTML, no allowlist</text>
    <rect x="288" y="378" width="14" height="14" rx="2" fill="#1c212a" stroke="#d4a94a"/>
    <text x="295" y="388" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="8" fill="#d4a94a">Δ</text>

    <rect x="60" y="442" width="248" height="52" rx="4" fill="#151920" stroke="#2c333e"/>
