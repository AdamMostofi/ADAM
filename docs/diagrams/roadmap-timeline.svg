<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="road-title road-desc">
  <title id="road-title">ADAM roadmap timeline</title>
  <desc id="road-desc">A release-order timeline from V0.2 through V1.1, with V0.8 marked current.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8a877e"/>
    </marker>
  </defs>

  <rect width="1100" height="560" fill="#0b0d10"/>
  <rect x="20" y="20" width="1060" height="520" rx="6" fill="#101318" stroke="#2c333e"/>

  <g font-family="'IBM Plex Mono', 'Courier New', monospace">
    <text x="44" y="52" font-size="9" letter-spacing="2.2" fill="#d4a94a">ADAM / ROADMAP</text>
    <text x="1056" y="52" font-size="9" text-anchor="end" fill="#8a877e">RELEASE ORDER</text>
  </g>
  <text x="44" y="88" font-family="'Cinzel', 'Times New Roman', serif" font-size="28" fill="#e8e6df">Roadmap, in release order</text>
  <text x="44" y="112" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" fill="#8a877e">Versions are ordered, not dated. V0.8 is the current working version.</text>
  <line x1="44" y1="132" x2="1056" y2="132" stroke="#2c333e"/>

  <g font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="8" fill="#5f6570">
    <text x="60" y="180">SHIPPED</text>
    <text x="703" y="180" fill="#d4a94a">AFTER V0.8</text>
  </g>
  <g stroke="#2c333e">
    <line x1="60" y1="190" x2="703" y2="190"/>
    <line x1="703" y1="190" x2="1040" y2="190" stroke-dasharray="4,3"/>
  </g>

  <line x1="60" y1="300" x2="703" y2="300" stroke="#46505f" stroke-width="1.2"/>
  <line x1="703" y1="300" x2="1040" y2="300" stroke="#2c333e" stroke-width="1.2" stroke-dasharray="5,4"/>

  <g stroke="#2c333e" stroke-width="1">
    <line x1="90" y1="300" x2="90" y2="276"/>
    <line x1="192.2" y1="300" x2="192.2" y2="324"/>
    <line x1="294.4" y1="300" x2="294.4" y2="276"/>
    <line x1="396.7" y1="300" x2="396.7" y2="324"/>
    <line x1="498.9" y1="300" x2="498.9" y2="276"/>
    <line x1="601.1" y1="300" x2="601.1" y2="324"/>
    <line x1="703.3" y1="300" x2="703.3" y2="276"/>
    <line x1="805.6" y1="300" x2="805.6" y2="324"/>
    <line x1="907.8" y1="300" x2="907.8" y2="276"/>
    <line x1="1010" y1="300" x2="1010" y2="324"/>
  </g>

  <g fill="#151920" stroke="#8a877e" stroke-width="1">
    <circle cx="90" cy="300" r="4"/>
    <circle cx="192.2" cy="300" r="4"/>
    <circle cx="294.4" cy="300" r="4"/>
    <circle cx="396.7" cy="300" r="4"/>
    <circle cx="498.9" cy="300" r="4"/>
    <circle cx="601.1" cy="300" r="4"/>
    <circle cx="805.6" cy="300" r="4" fill="#101318" stroke="#5f6570"/>
    <circle cx="907.8" cy="300" r="4" fill="#101318" stroke="#5f6570"/>
    <circle cx="1010" cy="300" r="4" fill="#101318" stroke="#5f6570"/>
  </g>
  <circle cx="703.3" cy="300" r="6" fill="#d4a94a"/>

  <text x="703.3" y="232" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="7" letter-spacing="1.4" fill="#d4a94a">CURRENT</text>

  <g font-family="'Oswald', 'Arial Narrow', sans-serif" font-size="11" fill="#e8e6df">
    <text x="90" y="252" text-anchor="middle">V0.2</text>
    <text x="90" y="268" text-anchor="middle" fill="#b8b4a8">Kernel</text>

    <text x="192.2" y="340" text-anchor="middle">V0.3</text>
    <text x="192.2" y="356" text-anchor="middle" fill="#b8b4a8">Memory</text>

    <text x="294.4" y="252" text-anchor="middle">V0.4</text>
    <text x="294.4" y="268" text-anchor="middle" fill="#b8b4a8">Learning</text>

    <text x="396.7" y="340" text-anchor="middle">V0.5</text>
    <text x="396.7" y="356" text-anchor="middle" fill="#b8b4a8">EQ</text>

    <text x="498.9" y="252" text-anchor="middle">V0.6</text>
    <text x="498.9" y="268" text-anchor="middle" fill="#b8b4a8">Interface</text>

    <text x="601.1" y="340" text-anchor="middle">V0.7</text>
    <text x="601.1" y="356" text-anchor="middle" fill="#b8b4a8">Ear + Mouth</text>

    <text x="703.3" y="252" text-anchor="middle" fill="#d4a94a">V0.8</text>
    <text x="703.3" y="268" text-anchor="middle" fill="#d4a94a">UI + Hyperon</text>

    <text x="805.6" y="340" text-anchor="middle" fill="#b8b4a8">V0.9</text>
    <text x="805.6" y="356" text-anchor="middle" fill="#5f6570">USB</text>

    <text x="907.8" y="252" text-anchor="middle" fill="#b8b4a8">V1.0</text>
    <text x="907.8" y="268" text-anchor="middle" fill="#5f6570">Clones</text>

    <text x="1010" y="340" text-anchor="middle" fill="#b8b4a8">V1.1</text>
    <text x="1010" y="356" text-anchor="middle" fill="#5f6570">Optimization</text>
  </g>

  <line x1="44" y1="410" x2="1056" y2="410" stroke="#2c333e"/>
  <rect x="44" y="430" width="4" height="28" fill="#d4a94a"/>
  <text x="62" y="448" font-family="'Oswald', 'Arial Narrow', sans-serif" font-size="14" fill="#e8e6df">The foundation is shipped; portability, clones, and hardware tuning are next.</text>
  <text x="62" y="466" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="8" fill="#8a877e">V0.8 combines the interface overhaul with the Hyperon-derived reasoning additions.</text>

  <line x1="44" y1="500" x2="1056" y2="500" stroke="#2c333e"/>
  <text x="44" y="520" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="8" fill="#5f6570">Release labels describe scope, not calendar dates.</text>
  <text x="1056" y="520" text-anchor="end" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="8" fill="#8a877e">docs/COMMITS.md</text>
</svg>
