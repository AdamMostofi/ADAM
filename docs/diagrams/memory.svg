<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Inter, -apple-system, sans-serif">
  <rect width="800" height="400" fill="#FAFAF9"/>
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1C1917">V0.3 — Memory System</text>
  <text x="400" y="50" text-anchor="middle" font-size="12" fill="#78716C">3-layer storage: SQLite + LanceDB + NetworkX</text>

  <text x="20" y="85" font-size="11" font-weight="600" fill="#A8A29E">Storage Layers</text>

  <rect x="20" y="100" width="200" height="50" rx="8" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="120" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="#1C1917">SQLite (exact)</text>

  <rect x="300" y="100" width="200" height="50" rx="8" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="400" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="#1C1917">LanceDB (semantic)</text>

  <rect x="580" y="100" width="200" height="50" rx="8" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="680" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="#1C1917">NetworkX (graph)</text>

  <text x="20" y="190" font-size="11" font-weight="600" fill="#A8A29E">API Flow</text>

  <rect x="20" y="205" width="100" height="40" rx="8" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="70" y="230" text-anchor="middle" font-size="12" font-weight="600" fill="#1C1917">store(fact)</text>

  <line x1="120" y1="225" x2="150" y2="225" stroke="#A8A29E" stroke-width="2"/>
  <polygon points="150,220 160,225 150,230" fill="#A8A29E"/>

  <rect x="160" y="205" width="140" height="40" rx="8" fill="#1C1917"/>
  <text x="230" y="230" text-anchor="middle" font-size="12" font-weight="600" fill="#FAFAF9">MemorySystem</text>

  <line x1="300" y1="225" x2="330" y2="225" stroke="#A8A29E" stroke-width="2"/>
  <polygon points="330,220 340,225 330,230" fill="#A8A29E"/>

  <rect x="340" y="205" width="130" height="40" rx="8" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="405" y="230" text-anchor="middle" font-size="12" font-weight="600" fill="#1C1917">recall(query)</text>

  <rect x="490" y="205" width="140" height="40" rx="8" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="560" y="230" text-anchor="middle" font-size="12" font-weight="600" fill="#1C1917">search(query)</text>

  <line x1="630" y1="225" x2="660" y2="225" stroke="#A8A29E" stroke-width="2"/>
  <polygon points="660,220 670,225 660,230" fill="#A8A29E"/>

  <rect x="670" y="205" width="110" height="40" rx="8" fill="#1C1917"/>
  <text x="725" y="230" text-anchor="middle" font-size="12" font-weight="600" fill="#FAFAF9">Auto-connect</text>

  <text x="20" y="290" font-size="11" font-weight="600" fill="#A8A29E">Features</text>

  <rect x="20" y="305" width="120" height="35" rx="6" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="80" y="327" text-anchor="middle" font-size="11" font-weight="600" fill="#1C1917">Perfect recall</text>

  <rect x="160" y="305" width="130" height="35" rx="6" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="225" y="327" text-anchor="middle" font-size="11" font-weight="600" fill="#1C1917">Semantic search</text>

  <rect x="310" y="305" width="130" height="35" rx="6" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="375" y="327" text-anchor="middle" font-size="11" font-weight="600" fill="#1C1917">Auto-connection</text>

  <rect x="460" y="305" width="100" height="35" rx="6" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="510" y="327" text-anchor="middle" font-size="11" font-weight="600" fill="#1C1917">Save/Load</text>

  <rect x="580" y="305" width="120" height="35" rx="6" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="640" y="327" text-anchor="middle" font-size="11" font-weight="600" fill="#1C1917">Thread-safe</text>
</svg>
