<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Inter, -apple-system, sans-serif">
  <rect width="800" height="450" fill="#FAFAF9"/>
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1C1917">V0.7 — Ear/Mouth Pipeline</text>
  <text x="400" y="50" text-anchor="middle" font-size="12" fill="#78716C">Needle 2 (45M params) + TinyChat15M (15M params)</text>

  <text x="20" y="85" font-size="11" font-weight="600" fill="#A8A29E">Full Pipeline</text>

  <rect x="20" y="100" width="80" height="40" rx="8" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="60" y="125" text-anchor="middle" font-size="11" font-weight="600" fill="#1C1917">User Text</text>

  <line x1="100" y1="120" x2="130" y2="120" stroke="#A8A29E" stroke-width="2"/>
  <polygon points="130,115 140,120 130,125" fill="#A8A29E"/>

  <rect x="140" y="100" width="110" height="40" rx="8" fill="#1C1917"/>
  <text x="195" y="125" text-anchor="middle" font-size="11" font-weight="600" fill="#FAFAF9">Ear: Needle 2</text>

  <line x1="250" y1="120" x2="280" y2="120" stroke="#A8A29E" stroke-width="2"/>
  <polygon points="280,115 290,120 280,125" fill="#A8A29E"/>

  <rect x="290" y="100" width="120" height="40" rx="8" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="350" y="125" text-anchor="middle" font-size="10" font-weight="600" fill="#1C1917">Structured Intent</text>

  <line x1="410" y1="120" x2="440" y2="120" stroke="#A8A29E" stroke-width="2"/>
  <polygon points="440,115 450,120 440,125" fill="#A8A29E"/>

  <rect x="450" y="100" width="90" height="40" rx="8" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="495" y="125" text-anchor="middle" font-size="11" font-weight="600" fill="#1C1917">ADAM Core</text>

  <line x1="540" y1="120" x2="570" y2="120" stroke="#A8A29E" stroke-width="2"/>
  <polygon points="570,115 580,120 570,125" fill="#A8A29E"/>

  <rect x="580" y="100" width="120" height="40" rx="8" fill="#1C1917"/>
  <text x="640" y="125" text-anchor="middle" font-size="11" font-weight="600" fill="#FAFAF9">Mouth: TinyChat</text>

  <line x1="700" y1="120" x2="730" y2="120" stroke="#A8A29E" stroke-width="2"/>
  <polygon points="730,115 740,120 730,125" fill="#A8A29E"/>

  <rect x="740" y="100" width="50" height="40" rx="8" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="765" y="125" text-anchor="middle" font-size="10" font-weight="600" fill="#1C1917">Out</text>

  <text x="20" y="180" font-size="11" font-weight="600" fill="#A8A29E">Ear — Needle 2</text>

  <rect x="20" y="195" width="100" height="35" rx="6" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="70" y="217" text-anchor="middle" font-size="11" font-weight="600" fill="#1C1917">Text Input</text>

  <line x1="120" y1="212" x2="140" y2="212" stroke="#A8A29E" stroke-width="2"/>
  <polygon points="140,207 150,212 140,217" fill="#A8A29E"/>

  <rect x="150" y="195" width="130" height="35" rx="6" fill="#1C1917"/>
  <text x="215" y="217" text-anchor="middle" font-size="11" font-weight="600" fill="#FAFAF9">Pydantic Schema</text>

  <line x1="280" y1="212" x2="300" y2="212" stroke="#A8A29E" stroke-width="2"/>
  <polygon points="300,207 310,212 300,217" fill="#A8A29E"/>

  <rect x="310" y="195" width="100" height="35" rx="6" fill="#1C1917"/>
  <text x="360" y="217" text-anchor="middle" font-size="11" font-weight="600" fill="#FAFAF9">extract()</text>

  <line x1="410" y1="212" x2="430" y2="212" stroke="#A8A29E" stroke-width="2"/>
  <polygon points="430,207 440,212 430,217" fill="#A8A29E"/>

  <rect x="440" y="195" width="130" height="35" rx="6" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="505" y="217" text-anchor="middle" font-size="11" font-weight="600" fill="#1C1917">UserIntent JSON</text>

  <text x="20" y="270" font-size="11" font-weight="600" fill="#A8A29E">Mouth — TinyChat15M</text>

  <rect x="20" y="285" width="140" height="35" rx="6" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="90" y="307" text-anchor="middle" font-size="11" font-weight="600" fill="#1C1917">Core Response+Params</text>

  <line x1="160" y1="302" x2="180" y2="302" stroke="#A8A29E" stroke-width="2"/>
  <polygon points="180,297 190,302 180,307" fill="#A8A29E"/>

  <rect x="190" y="285" width="130" height="35" rx="6" fill="#1C1917"/>
  <text x="255" y="307" text-anchor="middle" font-size="11" font-weight="600" fill="#FAFAF9">format_response()</text>

  <line x1="320" y1="302" x2="340" y2="302" stroke="#A8A29E" stroke-width="2"/>
  <polygon points="340,297 350,302 340,307" fill="#A8A29E"/>

  <rect x="350" y="285" width="100" height="35" rx="6" fill="#1C1917"/>
  <text x="400" y="307" text-anchor="middle" font-size="11" font-weight="600" fill="#FAFAF9">speak()</text>

  <line x1="450" y1="302" x2="470" y2="302" stroke="#A8A29E" stroke-width="2"/>
  <polygon points="470,297 480,302 470,307" fill="#A8A29E"/>

  <rect x="480" y="285" width="130" height="35" rx="6" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="545" y="307" text-anchor="middle" font-size="11" font-weight="600" fill="#1C1917">Persona Output</text>

  <text x="20" y="360" font-size="11" font-weight="600" fill="#A8A29E">Memory</text>

  <rect x="20" y="375" width="200" height="35" rx="6" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="120" y="397" text-anchor="middle" font-size="11" font-weight="600" fill="#1C1917">Needle 2: 14MB binary</text>

  <rect x="250" y="375" width="200" height="35" rx="6" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="350" y="397" text-anchor="middle" font-size="11" font-weight="600" fill="#1C1917">TinyChat15M: ~30MB weights</text>

  <rect x="480" y="375" width="200" height="35" rx="6" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="580" y="397" text-anchor="middle" font-size="11" font-weight="600" fill="#1C1917">Total: ~44MB disk, ~90MB RAM</text>
</svg>
