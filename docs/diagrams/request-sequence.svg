<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="seq-title seq-desc">
  <title id="seq-title">ADAM request sequence</title>
  <desc id="seq-desc">A browser sends a message through ADAMCore to the Ear, affect appraisal, memory and the kernel, then to the Mouth, and receives a JSON response.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8a877e"/>
    </marker>
    <marker id="arrow-brass" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d4a94a"/>
    </marker>
  </defs>

  <rect width="1000" height="640" fill="#0b0d10"/>
  <rect x="20" y="20" width="960" height="600" rx="6" fill="#101318" stroke="#2c333e"/>

  <g font-family="'IBM Plex Mono', 'Courier New', monospace">
    <text x="44" y="52" font-size="9" letter-spacing="2.2" fill="#d4a94a">ADAM / REQUEST LIFECYCLE</text>
    <text x="956" y="52" font-size="9" text-anchor="end" fill="#8a877e">SYNC / JSON</text>
  </g>
  <text x="44" y="88" font-family="'Cinzel', 'Times New Roman', serif" font-size="28" fill="#e8e6df">One transmission, end to end</text>
  <text x="44" y="112" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" fill="#8a877e">A message becomes an intent, a memory query, a proof, and a voice.</text>
  <line x1="44" y1="132" x2="956" y2="132" stroke="#2c333e"/>

  <g font-family="'Oswald', 'Arial Narrow', sans-serif">
    <rect x="40" y="150" width="160" height="56" rx="4" fill="#151920" stroke="#2c333e"/>
    <text x="120" y="175" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e6df">BROWSER</text>
    <text x="120" y="193" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="8" fill="#8a877e">render / store</text>

    <rect x="240" y="150" width="160" height="56" rx="4" fill="#151920" stroke="#d4a94a"/>
    <text x="320" y="175" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e6df">ADAMCORE</text>
    <text x="320" y="193" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="8" fill="#8a877e">chat orchestration</text>

    <rect x="440" y="150" width="160" height="56" rx="4" fill="#151920" stroke="#2c333e"/>
    <text x="520" y="175" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e6df">EAR / EQ</text>
    <text x="520" y="193" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="8" fill="#8a877e">intent / appraisal</text>

    <rect x="640" y="150" width="160" height="56" rx="4" fill="#151920" stroke="#2c333e"/>
    <text x="720" y="175" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e6df">MEMORY / KERNEL</text>
    <text x="720" y="193" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="8" fill="#8a877e">recall / infer / prove</text>

    <rect x="800" y="150" width="160" height="56" rx="4" fill="#151920" stroke="#2c333e"/>
    <text x="880" y="175" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e6df">MOUTH</text>
    <text x="880" y="193" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="8" fill="#8a877e">TinyChat15M</text>
  </g>

  <g stroke="#2c333e" stroke-width="1" stroke-dasharray="3,4">
    <line x1="120" y1="206" x2="120" y2="560"/>
    <line x1="320" y1="206" x2="320" y2="560"/>
    <line x1="520" y1="206" x2="520" y2="560"/>
    <line x1="720" y1="206" x2="720" y2="560"/>
    <line x1="880" y1="206" x2="880" y2="560"/>
  </g>

  <g fill="#1c212a" stroke="#46505f" stroke-width="0.8">
    <rect x="116" y="250" width="8" height="270"/>
    <rect x="316" y="250" width="8" height="270"/>
    <rect x="516" y="288" width="8" height="38"/>
    <rect x="716" y="364" width="8" height="38"/>
    <rect x="876" y="440" width="8" height="38"/>
  </g>

  <g fill="none" stroke-width="1.2">
    <line x1="120" y1="250" x2="314" y2="250" stroke="#8a877e" marker-end="url(#arrow)"/>
    <line x1="320" y1="288" x2="514" y2="288" stroke="#8a877e" marker-end="url(#arrow)"/>
    <line x1="520" y1="326" x2="326" y2="326" stroke="#8a877e" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <line x1="320" y1="364" x2="714" y2="364" stroke="#8a877e" marker-end="url(#arrow)"/>
    <line x1="720" y1="402" x2="326" y2="402" stroke="#8a877e" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <line x1="320" y1="440" x2="874" y2="440" stroke="#8a877e" marker-end="url(#arrow)"/>
    <line x1="880" y1="478" x2="326" y2="478" stroke="#8a877e" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <line x1="320" y1="520" x2="126" y2="520" stroke="#d4a94a" marker-end="url(#arrow-brass)"/>
  </g>

  <g font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="8.5" fill="#b8b4a8">
    <rect x="176" y="228" width="88" height="14" rx="2" fill="#101318"/>
    <text x="220" y="238" text-anchor="middle">POST /api/chat</text>

    <rect x="382" y="266" width="72" height="14" rx="2" fill="#101318"/>
    <text x="418" y="276" text-anchor="middle">listen(text)</text>

    <rect x="370" y="304" width="100" height="14" rx="2" fill="#101318"/>
    <text x="420" y="314" text-anchor="middle">intent + appraisal</text>

    <rect x="462" y="342" width="118" height="14" rx="2" fill="#101318"/>
    <text x="521" y="352" text-anchor="middle">recall / infer / prove</text>

    <rect x="470" y="380" width="84" height="14" rx="2" fill="#101318"/>
    <text x="512" y="390" text-anchor="middle">facts + proof</text>

    <rect x="524" y="418" width="148" height="14" rx="2" fill="#101318"/>
    <text x="598" y="428" text-anchor="middle">format_response(context)</text>

    <rect x="554" y="456" width="80" height="14" rx="2" fill="#101318"/>
    <text x="594" y="466" text-anchor="middle">persona text</text>

    <rect x="176" y="498" width="94" height="14" rx="2" fill="#101318"/>
    <text x="223" y="508" text-anchor="middle" fill="#d4a94a">response + state</text>
  </g>

  <line x1="44" y1="580" x2="956" y2="580" stroke="#2c333e"/>
  <text x="44" y="600" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="8" fill="#8a877e">The call is synchronous; the word-by-word reveal happens in the browser after the JSON arrives.</text>
  <text x="956" y="600" text-anchor="end" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="8" fill="#5f6570">return messages are dashed</text>
</svg>
