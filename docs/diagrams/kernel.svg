<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Inter, -apple-system, sans-serif">
  <rect width="800" height="400" fill="#FAFAF9"/>
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1C1917">V0.2 — Logical Kernel</text>
  <text x="400" y="50" text-anchor="middle" font-size="12" fill="#78716C">16 foundational rules, O(n) predicate-indexed agenda inference</text>

  <text x="20" y="85" font-size="11" font-weight="600" fill="#A8A29E">Architecture</text>

  <rect x="20" y="100" width="100" height="40" rx="8" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="70" y="125" text-anchor="middle" font-size="12" font-weight="600" fill="#1C1917">Input Facts</text>

  <line x1="120" y1="120" x2="150" y2="120" stroke="#A8A29E" stroke-width="2"/>
  <polygon points="150,115 160,120 150,125" fill="#A8A29E"/>

  <rect x="160" y="100" width="130" height="40" rx="8" fill="#1C1917"/>
  <text x="225" y="125" text-anchor="middle" font-size="12" font-weight="600" fill="#FAFAF9">Predicate Index</text>

  <line x1="290" y1="120" x2="320" y2="120" stroke="#A8A29E" stroke-width="2"/>
  <polygon points="320,115 330,120 320,125" fill="#A8A29E"/>

  <rect x="330" y="100" width="120" height="40" rx="8" fill="#1C1917"/>
  <text x="390" y="125" text-anchor="middle" font-size="12" font-weight="600" fill="#FAFAF9">Agenda (O(n))</text>

  <line x1="450" y1="120" x2="480" y2="120" stroke="#A8A29E" stroke-width="2"/>
  <polygon points="480,115 490,120 480,125" fill="#A8A29E"/>

  <rect x="490" y="100" width="120" height="40" rx="8" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="550" y="125" text-anchor="middle" font-size="12" font-weight="600" fill="#1C1917">Inferred Facts</text>

  <text x="20" y="180" font-size="11" font-weight="600" fill="#A8A29E">16 Rules</text>

  <rect x="20" y="195" width="100" height="30" rx="6" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="70" y="215" text-anchor="middle" font-size="10" font-weight="600" fill="#1C1917">modus_ponens</text>

  <rect x="130" y="195" width="100" height="30" rx="6" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="180" y="215" text-anchor="middle" font-size="10" font-weight="600" fill="#1C1917">modus_tollens</text>

  <rect x="240" y="195" width="90" height="30" rx="6" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="285" y="215" text-anchor="middle" font-size="10" font-weight="600" fill="#1C1917">transitivity</text>

  <rect x="340" y="195" width="110" height="30" rx="6" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="395" y="215" text-anchor="middle" font-size="10" font-weight="600" fill="#1C1917">is_transitivity</text>

  <rect x="460" y="195" width="140" height="30" rx="6" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="530" y="215" text-anchor="middle" font-size="10" font-weight="600" fill="#1C1917">subtype_transitivity</text>

  <rect x="610" y="195" width="170" height="30" rx="6" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="695" y="215" text-anchor="middle" font-size="10" font-weight="600" fill="#1C1917">universal_instantiation</text>

  <rect x="20" y="235" width="140" height="30" rx="6" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="90" y="255" text-anchor="middle" font-size="10" font-weight="600" fill="#1C1917">existential_generalization</text>

  <rect x="170" y="235" width="160" height="30" rx="6" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="250" y="255" text-anchor="middle" font-size="10" font-weight="600" fill="#1C1917">universal_generalization</text>

  <rect x="340" y="235" width="140" height="30" rx="6" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="410" y="255" text-anchor="middle" font-size="10" font-weight="600" fill="#1C1917">equality_substitution</text>

  <rect x="490" y="235" width="140" height="30" rx="6" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="560" y="255" text-anchor="middle" font-size="10" font-weight="600" fill="#1C1917">disjunctive_syllogism</text>

  <rect x="640" y="235" width="140" height="30" rx="6" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="710" y="255" text-anchor="middle" font-size="10" font-weight="600" fill="#1C1917">contradiction_detect</text>

  <rect x="20" y="275" width="110" height="30" rx="6" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="75" y="295" text-anchor="middle" font-size="10" font-weight="600" fill="#1C1917">de_morgan_and</text>

  <rect x="140" y="275" width="110" height="30" rx="6" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="195" y="295" text-anchor="middle" font-size="10" font-weight="600" fill="#1C1917">de_morgan_or</text>

  <rect x="260" y="275" width="120" height="30" rx="6" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="320" y="295" text-anchor="middle" font-size="10" font-weight="600" fill="#1C1917">double_negation</text>

  <rect x="390" y="275" width="130" height="30" rx="6" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="455" y="295" text-anchor="middle" font-size="10" font-weight="600" fill="#1C1917">conditional_proof</text>

  <text x="20" y="345" font-size="11" font-weight="600" fill="#A8A29E">Supporting Systems</text>

  <rect x="20" y="360" width="160" height="30" rx="6" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="100" y="380" text-anchor="middle" font-size="10" font-weight="600" fill="#1C1917">KnowledgeGraph</text>

  <rect x="200" y="360" width="160" height="30" rx="6" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="280" y="380" text-anchor="middle" font-size="10" font-weight="600" fill="#1C1917">ContradictionResolver</text>

  <rect x="380" y="360" width="140" height="30" rx="6" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="450" y="380" text-anchor="middle" font-size="10" font-weight="600" fill="#1C1917">Unification</text>

  <rect x="540" y="360" width="120" height="30" rx="6" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="600" y="380" text-anchor="middle" font-size="10" font-weight="600" fill="#1C1917">RLock</text>
</svg>
