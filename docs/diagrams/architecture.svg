<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">ADAM system architecture</title>
  <desc id="arch-desc">A local pipeline from user and interface through the Ear into four core subsystems, then out through the Mouth.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8a877e"/>
    </marker>
    <marker id="arrow-brass" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d4a94a"/>
    </marker>
  </defs>

  <rect width="1000" height="560" fill="#0b0d10"/>
  <rect x="20" y="20" width="960" height="520" rx="6" fill="#101318" stroke="#2c333e"/>

  <g font-family="'IBM Plex Mono', 'Courier New', monospace">
    <text x="44" y="52" font-size="9" letter-spacing="2.2" fill="#d4a94a">ADAM / SYSTEM MAP</text>
    <text x="956" y="52" font-size="9" text-anchor="end" fill="#8a877e">V0.8 / OVERVIEW</text>
  </g>
  <text x="44" y="88" font-family="'Cinzel', 'Times New Roman', serif" font-size="28" fill="#e8e6df">One mind, four subsystems</text>
  <text x="44" y="112" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" fill="#8a877e">Local reasoning, persistent memory, and a small voice.</text>
  <line x1="44" y1="132" x2="956" y2="132" stroke="#2c333e"/>

  <g font-family="'Oswald', 'Arial Narrow', sans-serif">
    <rect x="44" y="200" width="112" height="58" rx="4" fill="#0b0d10" stroke="#46505f"/>
    <text x="100" y="226" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e6df">USER</text>
    <text x="100" y="245" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="8" fill="#8a877e">text / intent</text>

    <rect x="196" y="200" width="156" height="58" rx="4" fill="#151920" stroke="#2c333e"/>
    <text x="274" y="226" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e6df">INTERFACE</text>
    <text x="274" y="245" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="8" fill="#8a877e">CLI / Flask UI</text>

    <rect x="392" y="200" width="136" height="58" rx="4" fill="#151920" stroke="#2c333e"/>
    <text x="460" y="226" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e6df">EAR</text>
    <text x="460" y="245" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="8" fill="#8a877e">Needle 2</text>

    <rect x="856" y="200" width="100" height="58" rx="4" fill="#151920" stroke="#2c333e"/>
    <text x="906" y="226" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e6df">MOUTH</text>
    <text x="906" y="245" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="8" fill="#8a877e">TinyChat15M</text>

    <rect x="856" y="304" width="100" height="58" rx="4" fill="#0b0d10" stroke="#46505f"/>
    <text x="906" y="330" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e6df">RESPONSE</text>
    <text x="906" y="349" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="8" fill="#8a877e">local JSON</text>
  </g>

  <rect x="568" y="164" width="250" height="252" rx="6" fill="#151920" stroke="#d4a94a" stroke-width="1.2"/>
  <text x="588" y="188" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="8" letter-spacing="1.8" fill="#d4a94a">ADAM CORE</text>
  <text x="588" y="205" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="8" fill="#8a877e">four cooperating subsystems</text>

  <g font-family="'Oswald', 'Arial Narrow', sans-serif">
    <rect x="588" y="224" width="100" height="64" rx="4" fill="#101318" stroke="#2c333e"/>
    <rect x="588" y="232" width="3" height="48" fill="#d4a94a"/>
    <text x="600" y="248" font-size="12" font-weight="600" fill="#e8e6df">KERNEL</text>
    <text x="600" y="266" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="8" fill="#8a877e">16 rules / proof</text>

    <rect x="700" y="224" width="100" height="64" rx="4" fill="#101318" stroke="#2c333e"/>
    <rect x="700" y="232" width="3" height="48" fill="#4f7dff"/>
    <text x="712" y="248" font-size="12" font-weight="600" fill="#e8e6df">MEMORY</text>
    <text x="712" y="266" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="8" fill="#8a877e">SQLite / LanceDB</text>

    <rect x="588" y="304" width="100" height="64" rx="4" fill="#101318" stroke="#2c333e"/>
    <rect x="588" y="312" width="3" height="48" fill="#a86bff"/>
    <text x="600" y="328" font-size="12" font-weight="600" fill="#e8e6df">LEARNING</text>
    <text x="600" y="346" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="8" fill="#8a877e">patterns / skills</text>

    <rect x="700" y="304" width="100" height="64" rx="4" fill="#101318" stroke="#2c333e"/>
    <rect x="700" y="312" width="3" height="48" fill="#2fbf8f"/>
    <text x="712" y="328" font-size="12" font-weight="600" fill="#e8e6df">EQ</text>
    <text x="712" y="346" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="8" fill="#8a877e">appraisal / tone</text>
  </g>

  <g stroke="#8a877e" stroke-width="1.2" fill="none">
    <line x1="156" y1="229" x2="190" y2="229" marker-end="url(#arrow)"/>
    <line x1="352" y1="229" x2="386" y2="229" marker-end="url(#arrow)"/>
    <line x1="528" y1="229" x2="562" y2="229" marker-end="url(#arrow)"/>
    <line x1="818" y1="229" x2="850" y2="229" marker-end="url(#arrow-brass)"/>
    <line x1="906" y1="258" x2="906" y2="298" marker-end="url(#arrow)"/>
  </g>

  <g font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="8" fill="#8a877e">
    <text x="362" y="218" text-anchor="middle">request</text>
    <text x="545" y="218" text-anchor="middle">intent</text>
    <text x="834" y="218" text-anchor="middle" fill="#d4a94a">context</text>
    <text x="916" y="282">voice</text>
  </g>

  <line x1="44" y1="446" x2="956" y2="446" stroke="#2c333e"/>
  <rect x="44" y="466" width="4" height="28" fill="#d4a94a"/>
  <text x="62" y="484" font-family="'Oswald', 'Arial Narrow', sans-serif" font-size="14" fill="#e8e6df">Knowledge is stored, not baked into weights.</text>
  <text x="956" y="484" text-anchor="end" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="9" fill="#d4a94a">4 SUBSYSTEMS / 3 STORES / 0 CLOUD CALLS</text>
  <text x="44" y="520" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="8" fill="#8a877e">Local-first / Python / SQLite / LanceDB / NetworkX / llama-server</text>
</svg>
