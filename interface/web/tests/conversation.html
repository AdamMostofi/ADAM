<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>ADAM — Visual Test: Conversation</title>
  <script>
    const params = new URLSearchParams(location.search);
    const theme = params.get("theme") || "dark";
    document.documentElement.setAttribute("data-theme", theme);
    if (theme === "light") {
      const st = document.createElement("style");
      st.textContent = `html { background: #e8e0cd; }`;
      document.head.append(st);
    }
  </script>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <script src="/static/js/lib/marked.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>PRIMARCH ADAM</h1>
    </header>
    <main class="main" id="main"></main>
  </div>

  <script type="module">
    import { Conversation } from "/static/js/components/conversation.js";
    import { Message } from "/static/js/components/message.js";
    import { markdownToNode } from "/static/js/components/markdown.js";
    import { PromptInput } from "/static/js/components/prompt-input.js";
    import { ThinkingIndicator, Loader } from "/static/js/components/shimmer.js";

    const conv = new Conversation({
      emptyTitle: "The vox is silent",
      emptyDescription: "Awaiting transmission. Speak, and the Machine Spirit shall answer.",
    });
    document.getElementById("main").append(conv.el);

    const prompt = new PromptInput({
      placeholder: "Open a vox channel…",
      onSubmit: ({ text }) => {
        const m = new Message({ from: "user" });
        m.setContent(document.createTextNode(text));
        conv.addMessage("user", m.el);
      },
    });
    document.getElementById("main").append(prompt.el);

    const thinking = new ThinkingIndicator();
    const loader = new Loader({ label: "The cogitator hums…" });
    document.getElementById("main").append(thinking.el, loader.el);

    // Render a few sample messages to exercise the layout.
    const showEmpty = new URLSearchParams(location.search).has("empty");
    if (!showEmpty) {
      const add = (role, text) => {
        const m = new Message({ from: role });
        if (role === "assistant") m.setContent(markdownToNode(text));
        else m.setContent(document.createTextNode(text));
        if (role === "assistant") {
          m.addAction({ icon: "copy", label: "Copy", tooltip: "Copy to data-slate" });
          m.addAction({ icon: "retry", label: "Retry", tooltip: "Regenerate response" });
        }
        return conv.addMessage(role, m.el);
      };
      add("user", "Machine Spirit, what is the status of the cogitator?");
      add("assistant", "## Cogitator Status\n\nAll systems **nominal**. The logic engines burn bright and the data-vaults stand ready.\n\n- Logic engines: *online*\n- Data-vaults: *sealed*\n- Machine spirit: *content*\n\n> The Omnissiah guides the code.");
      add("user", "Recite the Litany of Activation.");
      add("assistant", "Bless the machine, whose works are just.\n\n```\nBLESS(CODE); // logic is pure\n```");
    }
    window.__conv = conv;
  </script>
</body>
</html>
