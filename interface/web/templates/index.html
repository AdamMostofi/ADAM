<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRIMARCH ADAM</title>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <span class="brand-title">Primarch Adam</span>
        <span class="brand-sub">First Of It's Kind</span>
      </div>
      <div class="header-right">
        <span class="header-status" id="header-status">Machine Spirit · online</span>
        <button id="theme-toggle" class="header-btn" type="button" title="Toggle theme" aria-label="Toggle theme">☾</button>
      </div>
    </header>

    <main class="main">
      <nav class="tabs" aria-label="Sections">
        <button class="tab active" data-tab="chat" type="button">Vox</button>
        <button class="tab" data-tab="graph" type="button">Cognition</button>
        <button class="tab" data-tab="memory" type="button">Data-Vaults</button>
        <button class="tab" data-tab="skills" type="button">Skills</button>
        <button class="tab" data-tab="settings" type="button">Rites</button>
      </nav>

      <section id="tab-chat" class="tab-content active">
        <div id="chat-pane" class="chat-pane"></div>
      </section>

      <section id="tab-graph" class="tab-content">
        <div class="pane-head"><h2>Knowledge Graph</h2><button id="graph-refresh" class="ghost-btn" type="button">Refresh</button></div>
        <div id="graph-container" class="graph-container"></div>
      </section>

      <section id="tab-memory" class="tab-content">
        <div class="pane-head">
          <h2>Data-Vaults</h2>
          <div class="pane-controls">
            <input id="memory-search" class="ghost-input" type="text" placeholder="Search the vaults…" aria-label="Search memories">
            <button id="memory-refresh" class="ghost-btn" type="button">Refresh</button>
          </div>
        </div>
        <div id="memory-list" class="scroll-list"></div>
      </section>

      <section id="tab-skills" class="tab-content">
        <div class="pane-head"><h2>Skills</h2><button id="skills-refresh" class="ghost-btn" type="button">Refresh</button></div>
        <div id="skills-list" class="scroll-list"></div>
      </section>

      <section id="tab-settings" class="tab-content">
        <div class="pane-head"><h2>Rites</h2></div>
        <div id="stats-panel" class="stats-panel"></div>
        <div class="settings-actions">
          <button id="save-btn" class="gold-btn" type="button">Save State</button>
          <button id="add-fact-btn" class="ghost-btn" type="button">Inscribe Fact</button>
        </div>
        <div id="add-fact-form" class="add-fact-form hidden">
          <input id="fact-subject" class="ghost-input" type="text" placeholder="Subject" aria-label="Subject">
          <input id="fact-predicate" class="ghost-input" type="text" placeholder="Predicate" aria-label="Predicate">
          <input id="fact-object" class="ghost-input" type="text" placeholder="Object" aria-label="Object">
          <button id="fact-submit" class="gold-btn" type="button">Inscribe</button>
        </div>
      </section>
    </main>
  </div>

  <script src="/static/js/lib/marked.min.js"></script>
  <script src="/static/js/lib/vis-network.min.js"></script>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
