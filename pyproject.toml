[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "adam"
version = "0.8.0"
description = "A local neuro-symbolic machine intelligence."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md"]
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "numpy>=1.24.0",
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "huggingface-hub>=0.20",
    "flask>=3.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "cactus-needle==3.2.1",  # newer releases need a native library no longer hosted (2026-11-05)
    # The memory engine, released on its own (Stage 3.6, #61): a pinned tag, no copy in this repository.
    "yewtree @ git+https://github.com/AdamMostofi/yewtree@v0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "hypothesis>=6.0.0",
]

[tool.setuptools.packages.find]
include = ["kernel*", "memory*", "learning*", "interface*"]
namespaces = true

[tool.setuptools.package-data]
"interface.web" = ["templates/*.html", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
